<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1168 300"
     class="diagrama-aula06" role="img" aria-label="Acurácia: as duas caixas de acerto sobre as quatro, 77,0%">
  <text class="eixo" x="250" y="26">O QUE ACONTECEU DE VERDADE</text>
  <text class="cabecalho" x="370" y="60" text-anchor="middle">Perdeu a conta</text>
  <text class="cabecalho" x="622" y="60" text-anchor="middle">Seguiu comprando</text>
  <text class="eixo" x="16" y="26">O QUE O MODELO DISSE</text>
  <text class="cabecalho" x="230" y="119" text-anchor="end">Marcou</text>
  <text class="cabecalho" x="230" y="209" text-anchor="end">Não marcou</text>
  <g class="celula acerto">
    <rect x="250" y="74" width="240" height="78" rx="10"/>
    <text class="sigla" x="266" y="96">VP · Verdadeiro positivo</text>
    <text class="valor" x="266" y="126">2.018<tspan class="unidade" dx="8">contas</tspan></text>
    <text class="legenda" x="266" y="144">marcadas, e se perderam</text>
  </g>
  <g class="celula">
    <rect x="502" y="74" width="240" height="78" rx="10"/>
    <text class="sigla" x="518" y="96">FP · Falso positivo</text>
    <text class="valor" x="518" y="126">643<tspan class="unidade" dx="8">contas</tspan></text>
    <text class="legenda" x="518" y="144">marcadas, e continuaram</text>
  </g>
  <g class="celula">
    <rect x="250" y="164" width="240" height="78" rx="10"/>
    <text class="sigla" x="266" y="186">FN · Falso negativo</text>
    <text class="valor" x="266" y="216">438<tspan class="unidade" dx="8">contas</tspan></text>
    <text class="legenda" x="266" y="234">não marcadas, e se perderam</text>
  </g>
  <g class="celula acerto">
    <rect x="502" y="164" width="240" height="78" rx="10"/>
    <text class="sigla" x="518" y="186">VN · Verdadeiro negativo</text>
    <text class="valor" x="518" y="216">1.609<tspan class="unidade" dx="8">contas</tspan></text>
    <text class="legenda" x="518" y="234">não marcadas, e continuaram</text>
  </g>
  <text class="legenda" x="806" y="268">Positivo e negativo dizem o que o modelo falou.</text>
  <text class="legenda" x="806" y="288">Verdadeiro e falso dizem se ele acertou.</text>
  <g class="fragment">
    <rect class="realce-den" x="243" y="67" width="254" height="92" rx="12"/>
    <rect class="realce-den" x="495" y="67" width="254" height="92" rx="12"/>
    <rect class="realce-den" x="243" y="157" width="254" height="92" rx="12"/>
    <rect class="realce-den" x="495" y="157" width="254" height="92" rx="12"/>
    <text class="rotulo-den" x="16" y="268">Denominador: as quatro caixas, ou seja, a carteira elegível inteira</text>
  </g>
  <g class="fragment">
    <rect class="realce-num" x="248" y="72" width="244" height="82" rx="12"/>
    <rect class="realce-num" x="500" y="162" width="244" height="82" rx="12"/>
    <text class="rotulo-num" x="16" y="290">Numerador: VP mais VN, as duas caixas em que o modelo acertou</text>
  </g>
  <g class="painel fragment">
    <rect x="806" y="74" width="346" height="168" rx="10"/>
    <text class="formula" x="826" y="106">(VP + VN) dividido pelo total</text>
    <text class="conta" x="826" y="132">(2.018 + 1.609) / 4.708</text>
    <text class="legenda" x="826" y="154">acertos divididos pelo total de contas</text>
    <text class="resultado" x="826" y="196">77,0%</text>
    <text class="resultado-rotulo" x="826" y="222">ACURÁCIA</text>
  </g>
</svg>
