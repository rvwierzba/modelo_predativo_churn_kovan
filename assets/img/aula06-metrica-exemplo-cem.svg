<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1168 300"
     class="diagrama-aula06" role="img" aria-label="Exemplo de 100 clientes: acurácia 86,0%, precisão 40,0% e recall 80,0%">
  <text class="eixo" x="200" y="26">O QUE ACONTECEU COM OS 100 CLIENTES</text>
  <text class="cabecalho" x="302" y="60" text-anchor="middle">Cancelaram (10)</text>
  <text class="cabecalho" x="520" y="60" text-anchor="middle">Continuaram (90)</text>
  <text class="eixo" x="16" y="26">O MODELO</text>
  <text class="cabecalho" x="186" y="118" text-anchor="end">Alertou (20)</text>
  <text class="cabecalho" x="186" y="206" text-anchor="end">Não alertou (80)</text>
  <g class="celula">
    <rect x="200" y="74" width="205" height="76" rx="10"/>
    <text class="sigla" x="214" y="96">VP · Verdadeiro positivo</text>
    <text class="valor" x="214" y="124">8<tspan class="unidade" dx="8">clientes</tspan></text>
    <text class="legenda" x="214" y="142">alertados que cancelaram</text>
  </g>
  <g class="celula">
    <rect x="417" y="74" width="205" height="76" rx="10"/>
    <text class="sigla" x="431" y="96">FP · Falso positivo</text>
    <text class="valor" x="431" y="124">12<tspan class="unidade" dx="8">clientes</tspan></text>
    <text class="legenda" x="431" y="142">alertados que continuaram</text>
  </g>
  <g class="celula">
    <rect x="200" y="162" width="205" height="76" rx="10"/>
    <text class="sigla" x="214" y="184">FN · Falso negativo</text>
    <text class="valor" x="214" y="212">2<tspan class="unidade" dx="8">clientes</tspan></text>
    <text class="legenda" x="214" y="230">não alertados que cancelaram</text>
  </g>
  <g class="celula">
    <rect x="417" y="162" width="205" height="76" rx="10"/>
    <text class="sigla" x="431" y="184">VN · Verdadeiro negativo</text>
    <text class="valor" x="431" y="212">78<tspan class="unidade" dx="8">clientes</tspan></text>
    <text class="legenda" x="431" y="230">não alertados que continuaram</text>
  </g>
  <g class="fragment fade-in-then-out" data-fragment-index="1">
    <rect class="realce-num" x="197" y="71" width="211" height="82" rx="12"/>
    <rect class="realce-num" x="414" y="159" width="211" height="82" rx="12"/>
  </g>
  <g class="painel fragment" data-fragment-index="1">
    <rect x="660" y="74" width="490" height="62" rx="10"/>
    <text class="formula" x="678" y="100">Acurácia</text>
    <text class="legenda" x="678" y="122">(8 + 78) acertos / 100 clientes</text>
    <text class="resultado" x="1132" y="118" text-anchor="end">86,0%</text>
  </g>
  <g class="fragment fade-in-then-out" data-fragment-index="2">
    <rect class="realce-num" x="197" y="71" width="211" height="82" rx="12"/>
    <rect class="realce-num" x="414" y="71" width="211" height="82" rx="12"/>
  </g>
  <g class="painel fragment" data-fragment-index="2">
    <rect x="660" y="146" width="490" height="62" rx="10"/>
    <text class="formula" x="678" y="172">Precisão</text>
    <text class="legenda" x="678" y="194">8 acertos / 20 alertas disparados</text>
    <text class="resultado" x="1132" y="190" text-anchor="end">40,0%</text>
  </g>
  <g class="fragment fade-in-then-out" data-fragment-index="3">
    <rect class="realce-num" x="197" y="71" width="211" height="82" rx="12"/>
    <rect class="realce-num" x="197" y="159" width="211" height="82" rx="12"/>
  </g>
  <g class="painel fragment" data-fragment-index="3">
    <rect x="660" y="218" width="490" height="62" rx="10"/>
    <text class="formula" x="678" y="244">Recall</text>
    <text class="legenda" x="678" y="266">8 achados / 10 que iam cancelar</text>
    <text class="resultado" x="1132" y="262" text-anchor="end">80,0%</text>
  </g>
</svg>
