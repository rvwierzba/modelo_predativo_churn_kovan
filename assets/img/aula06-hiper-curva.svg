  </g>
  <g class="fragment" data-fragment-index="2">
    <path class="curva validacao" d="M 150.0 73.6 L 165.8 80.0 L 181.5 86.0 L 197.2 91.7 L 213.0 97.0 L 228.8 101.9 L 244.5 106.4 L 260.2 110.6 L 276.0 114.4 L 291.8 117.8 L 307.5 120.9 L 323.2 123.6 L 339.0 125.9 L 354.8 127.8 L 370.5 129.4 L 386.2 130.6 L 402.0 131.4 L 417.8 131.9 L 433.5 131.9 L 449.2 131.6 L 465.0 131.0 L 480.8 129.9 L 496.5 128.5 L 512.2 126.8 L 528.0 124.6 L 543.8 122.1 L 559.5 119.2 L 575.2 115.9 L 591.0 112.3 L 606.8 108.3 L 622.5 103.9 L 638.2 99.1 L 654.0 94.0 L 669.8 88.5 L 685.5 82.6 L 701.2 76.4 L 717.0 69.8 L 732.8 62.8 L 748.5 55.4 L 764.2 47.7 L 780.0 39.6"/>
