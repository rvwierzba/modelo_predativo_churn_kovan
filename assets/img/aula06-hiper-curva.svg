     class="diagrama-aula06" role="img" aria-label="Esquema de subajuste e sobreajuste: o erro de treino cai sempre e o de validação volta a subir">
  <path class="eixo-linha" d="M 150 46 L 150 244 L 794 244"/>
  <text class="eixo" x="138" y="56" text-anchor="end">ERRO</text>
  <text class="eixo" x="150" y="268">MODELO MAIS SIMPLES</text>
  <text class="eixo" x="794" y="268" text-anchor="end">MODELO MAIS COMPLEXO</text>
