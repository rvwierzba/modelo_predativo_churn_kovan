      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2e2640"/>
    </marker>
  </defs>
  <rect width="1168" height="334" fill="#ffffff"/>
  
  <rect x="0" y="2" width="470" height="58" rx="8" fill="#e6eaeb" stroke="#2e2640" stroke-opacity="0.25"/>
  <text x="22" y="32" font-size="25" font-weight="600" fill="#2e2640">Papel</text>
