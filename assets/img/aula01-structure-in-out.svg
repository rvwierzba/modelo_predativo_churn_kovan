  <rect x="0" y="68" width="470" height="58" rx="8" fill="#e6eaeb" stroke="#2e2640" stroke-opacity="0.25"/>
  <text x="22" y="98" font-size="25" font-weight="600" fill="#2e2640">Schema</text>
  <text x="22" y="125" font-size="19" fill="#2e2640">as 20 colunas, coladas no prompt</text>
  <path d="M 486 104 L 566 104" fill="none" stroke="#2e2640" stroke-width="2.5"
