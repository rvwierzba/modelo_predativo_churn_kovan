  <rect x="590" y="150" width="4" height="40" fill="#ff4545"/>
  <text x="608" y="167" font-size="16" fill="#2e2640" letter-spacing="0.06em">SEM ISSO</text>
  <text x="608" y="191" font-size="22" fill="#2e2640">média da base inteira</text>
  <rect x="0" y="200" width="470" height="58" rx="8" fill="#e6eaeb" stroke="#2e2640" stroke-opacity="0.25"/>
  <text x="22" y="230" font-size="25" font-weight="600" fill="#2e2640">Formato</text>
  <text x="22" y="257" font-size="19" fill="#2e2640">a tabela que você espera de volta</text>
