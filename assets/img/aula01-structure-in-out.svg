  <text x="608" y="125" font-size="22" fill="#2e2640">coluna que não existe</text>
  <rect x="0" y="134" width="470" height="58" rx="8" fill="#e6eaeb" stroke="#2e2640" stroke-opacity="0.25"/>
  <text x="22" y="164" font-size="25" font-weight="600" fill="#2e2640">Recorte</text>
  <text x="22" y="191" font-size="19" fill="#2e2640">segmento, janela, agrupamento</text>
  <path d="M 486 170 L 566 170" fill="none" stroke="#2e2640" stroke-width="2.5"
