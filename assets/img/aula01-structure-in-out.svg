  <rect x="590" y="216" width="4" height="40" fill="#ff4545"/>
  <text x="608" y="233" font-size="16" fill="#2e2640" letter-spacing="0.06em">SEM ISSO</text>
  <text x="608" y="257" font-size="22" fill="#2e2640">prosa, sem número</text>
